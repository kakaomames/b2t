name: BUild  V1
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: start
        run: |
          ls -lhF ./   
          bash start.sh || ls -lhF ./
          
      - name: 💾 成果物をリポジトリにコミット＆プッシュ
        run: |
          echo "[LOG] [ACTION] Git設定と成果物の格納..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Github Actions push the wav audio (Built from source)"
            git push
            echo "[LOG] [SUCCESS] 成果物を戦利品として保存しました！"
          fi
          
